[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qabench"
version = "0.1.10"
description = "The comprehensive QA tier, driven by a project's qa/manifest.yml: every page as every role in a real browser at two widths, every API route as every role, a smoke that names the dead secret, and an orchestrator whose verdict depends on what actually ran."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
qabench = "qabench.__main__:main"

[tool.setuptools.packages.find]
include = ["qabench*"]

[tool.setuptools.package-data]
qabench = ["estate.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
