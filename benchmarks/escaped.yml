# The seeded-fault benchmark — every defect a PERSON found, with the commit
# that fixed it. `qabench seed` reverts a sample of these on a throwaway branch
# and records which instrument goes red: that is the suite's RECALL, per
# shape, as a number. An instrument joins contract.yml only after it catches
# at least five of the rows it claims here (red at parent-of-fix, green at fix).
#
# Compiled 2026-09-19 from ana-log's docs/checker-calibration-ledger.md,
# docs/bugs/register.md and git history (see docs/methodology.md §1). Rows are
# facts about what reached a person; a row is never deleted, only marked.
#
# shape:   a sequence/second action · b rare data shape · c device/physical ·
#          d two correct halves (cross-layer contract) · e environment ·
#          f genuine UX request · g permission/scope · h other (sub: below)
# trigger: ODC field/function triggers — Sequencing, Interaction, Variation,
#          Coverage, Rare Situation, Side Effect, Hardware Configuration,
#          Software Configuration, Lateral Compatibility (two layers disagree),
#          Design Conformance (spec, decision, domain rule), Language Dependency
# check:   the C1–C12 check the ledger filed it under, or null
# fix:     commit(s) in the project's repo; null when still open
version: 1
rows:
