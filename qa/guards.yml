      cmd: "/Users/ramizajicek/Projects/qa-bench/.venv/bin/python scripts/qa/pop_commands.py"
      count: 16
    subject:
      cmd: "/Users/ramizajicek/Projects/qa-bench/.venv/bin/python scripts/qa/subj_exit3.py"
    capability:
      fires:
        - cmd: "/Users/ramizajicek/Projects/qa-bench/.venv/bin/python scripts/qa/selftest_exit3.py --fires"
          from: qabench/__main__.py
          was: "`show` — dispatched, and no test asserts any exit for it"
